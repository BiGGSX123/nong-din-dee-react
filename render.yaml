databases:
  - name: nong-din-dee-db
    plan: free
    databaseName: ndd
    user: ndd

services:
  # backend API — the "kitchen" that stays running and talks to the database
  - type: web
    name: nong-din-dee-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push && node prisma/seed.js
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nong-din-dee-db
          property: connectionString
      - key: SESSION_JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://nong-din-dee-web.onrender.com
      - key: NODE_ENV
        value: production
      # optional: only needed for real LINE login — leave unset and the game
      # runs in guest mode (no login, progress not saved between visits)
      - key: LINE_CHANNEL_ID
        sync: false

  # frontend — static files, with /api/* transparently proxied to the
  # backend above so the browser sees everything as one origin (this is the
  # same trick the local dev server does via Vite's proxy, which is also why
  # no CORS/cookie changes were needed anywhere in the app code)
  - type: web
    name: nong-din-dee-web
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://nong-din-dee-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # optional: only needed for real LINE login — leave unset for guest mode
      - key: VITE_LIFF_ID
        sync: false
