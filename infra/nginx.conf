# Installed at /etc/nginx/sites-available/nong-din-dee, symlinked into
# sites-enabled. `server_name _;` matches any Host header, which works both
# for plain IP access and for any *.ldd.go.th subdomain pointed here later
# (the installed cert is a wildcard for *.ldd.go.th / ldd.go.th -- it does
# NOT cover the bare IP, so https://<ip> will still show a browser warning
# and LINE LIFF will refuse it; a subdomain's DNS must point here for LIFF
# to actually work). The HTTP block below is left listening on its own so
# plain http://<ip> access for team testing keeps working unchanged.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/nong-din-dee/app/dist;
    index index.html;

    # performance: compress text assets (nginx's default only gzips HTML)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # Vite's hashed bundles never change under the same name → cache "forever"
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # game art (fixed names, may be replaced on a deploy) → cache for a day
    location ~* \.(?:webp|png|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # the app shell: always revalidate so a new deploy shows up right away
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/ldd-wildcard/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/ldd-wildcard/privkey.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/nong-din-dee/app/dist;
    index index.html;

    # performance: compress text assets (nginx's default only gzips HTML)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # Vite's hashed bundles never change under the same name → cache "forever"
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # game art (fixed names, may be replaced on a deploy) → cache for a day
    location ~* \.(?:webp|png|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # the app shell: always revalidate so a new deploy shows up right away
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
