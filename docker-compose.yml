services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ndd}
      POSTGRES_USER: ${POSTGRES_USER:-ndd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ndd}
    volumes:
      - ndd_postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ndd_postgres_data:
